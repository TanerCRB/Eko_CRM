# EKO-1-34 (#192), fix round 1, TRANSIENT. This file lives only on the throwaway branch
# EKO-1-34-probe-r1 and is never part of the PR. It is written under the conditions of boundary
# exception EKO-1-34/boundary-1, as the human approved for this branch.
#
# Second run (fix round 1, QA's untested guards). Isolation, the full job and the mutations b, b',
# c and dad are already on record from run 44387692426. This run has:
# - one job per mutation: K-02(a) again, with its kill matcher corrected, and QA's Linux-only
#   mutations o1, o2 and link. Each runs only the named test on a patched tree. It is green only if
#   that test goes red with the expected kill.
# - verdict: red unless every mutation job is green.
#
# Kill syntax (KILLS, judged by analyze.py): `|` separates strings that must all appear, and `||`
# separates alternatives, any one of which is enough. A kill starting with `re:` is a regular
# expression matched per line of the failure text. The anchored `^>` form names the line pytest
# marks as failing, not a line merely shown as context above it.
#
# Every job records the runner image version and `git rev-parse HEAD`. Its pytest output is
# redacted before upload by `.github/eko134-probe-r1/analyze.py`, with the same rules as the
# EKO-1-34 probe. The per-settle log lines come from the logging-only plugin
# `.github/eko134-probe-r1/eko134_probe_settle_log.py`, loaded with `-p`.
#
# Read-only token, no secret, no registry login, no workflow_dispatch.
name: eko134-probe-r1

on:
  push:
    branches: [EKO-1-34-probe-r1]

permissions:
  contents: read

concurrency:
  group: eko134-probe-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation ${{ matrix.id }} (only the named test, green only on the expected kill)
    runs-on: ubuntu-latest
    # One composition and its bootstrap, then one test.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each mutation job is a heavy runtime job; at most two run at once.
      max-parallel: 2
      matrix:
        include:
          - id: k02-a
            patch: k02-a.patch
            test: test_eko134_k02_new_veth_during_login_redirect_fails_at_the_pre_fix_harness
            # pytest prints the class name only (run 44387692426, job k02-a).
            kills: "DID NOT RAISE Error"
          - id: k02-o1
            patch: k02-o1.patch
            test: test_eko134_k02_new_veth_during_login_redirect_fails_at_the_pre_fix_harness
            kills: 're:^>\s+assert held\.failed_at is not None and held\.in_flight_at < held\.interfered_at < held\.failed_at\s*$'
          - id: k02-o2
            patch: k02-o2.patch
            test: test_eko134_k02_new_veth_during_login_redirect_fails_at_the_pre_fix_harness
            kills: 're:^>\s+assert held\.veth is not None and held\.veth not in held\.members_at_flight\s*$||DID NOT RAISE Error'
          - id: k02-link
            patch: k02-link.patch
            test: test_eko134_k02_continuous_interference_fails_the_wait_by_name_within_its_bound
            kills: "DID NOT RAISE HostNetworkNotSettled"
    env:
      MUTATION: ${{ matrix.id }}
      PATCH: ${{ matrix.patch }}
      TEST: ${{ matrix.test }}
      KILLS: ${{ matrix.kills }}
    steps:
      - name: Name the probe directory
        shell: bash
        run: echo "PROBE_DIR=$RUNNER_TEMP/eko134" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Record the run's identity (runner image, commit, Docker)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PROBE_DIR/raw" "$PROBE_DIR/upload" "$PROBE_DIR/basetemp"
          {
            echo "job=mutation-$MUTATION"
            echo "recorded_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "kernel=$(uname -r)"
            echo "docker_server=$(docker version --format '{{.Server.Version}}')"
          } > "$PROBE_DIR/upload/run-identity.txt"
          cat "$PROBE_DIR/upload/run-identity.txt"
      # The patch must apply and change exactly one file, or the job is red before any test.
      - name: Apply the mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          git apply ".github/eko134-probe-r1/$PATCH"
          changed="$(git diff --name-only)"
          echo "changed: $changed"
          [ "$(printf '%s\n' "$changed" | wc -l)" -eq 1 ] || { echo "::error::the patch changed more than one file"; exit 1; }
          git diff > "$PROBE_DIR/upload/mutation.diff"
      - name: Run only the named test on the mutated tree
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH=".:$GITHUB_WORKSPACE/.github/eko134-probe-r1"
          label="mutation-$MUTATION"
          if uv run pytest -m runtime "tests/runtime/test_eko134_k02_network_change_during_login.py::$TEST" \
              -v -rA -o log_cli=true --log-cli-level=INFO -p eko134_probe_settle_log \
              --basetemp="$PROBE_DIR/basetemp/$label" --junitxml="$PROBE_DIR/raw/$label.xml" \
              > "$PROBE_DIR/raw/$label.log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "pytest exited $rc"
          python3 -I "$GITHUB_WORKSPACE/.github/eko134-probe-r1/analyze.py" mutation "$label" \
            "$PROBE_DIR/raw/$label.log" "$PROBE_DIR/raw/$label.xml" "$rc" \
            "$PROBE_DIR/basetemp/$label" "$PROBE_DIR/upload" "$TEST" "$KILLS"
          echo "$label" >> "$PROBE_DIR/upload/analysed.txt"
      - name: Remove the raw logs' sources of secrets
        if: always()
        shell: bash
        run: rm -rf "$PROBE_DIR/basetemp"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eko134-probe-r1-mutation-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eko134/upload
          retention-days: 30
          if-no-files-found: error
      - name: Judge the kill
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          up="$PROBE_DIR/upload"
          [ -f "$up/analysed.txt" ] || { echo "::error::the mutated test was not analysed"; exit 1; }
          cat "$up/mutation.tsv"
          cat "$up/mutation-kill.txt"
          if [ -s "$up/problems.txt" ]; then
            cat "$up/problems.txt"
            echo "::error::mutation $MUTATION was not killed as expected"
            exit 1
          fi
          echo "mutation $MUTATION killed: $TEST red with the expected kill"

  # No masking: the run is red unless every mutation job is green.
  verdict:
    name: Verdict
    needs: [mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job green
        shell: bash
        env:
          MUTATIONS: ${{ needs.mutation.result }}
        run: |
          set -Eeuo pipefail
          echo "mutations: $MUTATIONS"
          [ "$MUTATIONS" = success ] || { echo "::error::a mutation job is $MUTATIONS"; exit 1; }
          echo "all jobs green"
