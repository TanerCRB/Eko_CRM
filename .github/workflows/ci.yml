# Product CI (K-05, Issue #19). Unit tests and static checks run on every PR; the runtime tests on
# the composition and the image builds run on PRs touching an architecture-sensitive path or the
# runtime tests' own files, and on main. The condition is a job `if:` fed by the `changes` job,
# never a workflow `paths` filter: a workflow skipped by a filter reports no status at all
# (process/ci-and-branch-protection.md, section 1).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.decide.outputs.runtime }}
    steps:
      # Actions pinned to full commit SHAs; the comment names the tag the SHA was taken from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the runtime tests and image builds run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-runtime-trigger.sh decide "$EVENT" "${BASE:-HEAD}" "${HEAD:-HEAD}" >> "$GITHUB_OUTPUT"

  # The range is the PR's base...head, or the pushed commits on main. A base the checkout does not
  # contain ends with exit 2, never "clean" (ADR-0001-C9, ADR-0003-C12).
  layers:
    name: layer check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Layer check against the base (ADR-0001-C9, ADR-0003-C12)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/layer-check.sh "$BASE" "$HEAD"

  backend:
    name: backend unit tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the release record for the API-compatibility step (EKO-1-15 K-06, C-3, C-7, C-8).
    permissions:
      contents: read
      packages: read
    steps:
      # Full history: the previous release counts only when its commit is reachable from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Registry login, read only (pulls the previous release's backend)
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Lock file is current (ADR-0001-C1)
        working-directory: backend
        run: uv lock --locked
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Lint and types
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
      - name: Unit tests and static checks (K-04, K-05, K-07)
        working-directory: backend
        env:
          CHANGESET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run pytest -v
      # The previous published release reachable from main, as its backend serves it (EKO-1-15
      # K-06); with none it says it compared nothing, and one it cannot obtain is red (exit 2).
      - name: API compatibility with the previous release (ADR-0004)
        working-directory: backend
        env:
          RELEASE_RECORD_TOKEN: ${{ github.token }}
        run: uv run python -m tests.support.openapi_compat --from-record

  frontend:
    name: frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install (ADR-0001-C2)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Type-aware lint: a Date in a template literal or a concatenation is judged by its type
      # (ADR-0001-C13 as restated 2026-10-29, G-7 A); `pnpm run build` does not catch it.
      - name: Lint (ADR-0001-C13)
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Type check and build
        working-directory: frontend
        run: pnpm run build

  # ADR-0001-C4: built with Docker only; this job installs no Python or Node.js on the runner.
  images:
    name: image builds and image checks
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t eko-backend:ci backend
          docker build -t eko-frontend:ci frontend
          docker build -t eko-proxy:ci proxy
          docker build -t eko-backup:ci backup
      # Proves the images built from the checkout hold no Node.js runtime and no .env* file. That
      # .dockerignore keeps a planted .env* out is proven by the runtime job
      # (tests/runtime/test_k07_image_env_decoys.py, decoys in every directory a Dockerfile copies).
      - name: Image checks (ADR-0001-C5, ADR-0004-C9)
        run: bash scripts/image-check.sh --frontend eko-frontend:ci eko-backend:ci eko-frontend:ci eko-proxy:ci eko-backup:ci

  runtime:
    name: runtime tests on the composition
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # EKO-1-20 (#76) 45 min no longer fits the lock-wait suite. EKO-1-12 boot-identity (#126, 2026-11-10): 78-83 min measured before cancellation at the 75 ceiling on both runtime jobs (suite ~45-50 + expiry 16:43 + r21 ~10 + restore ~6); 110 = ~30% margin; ceiling only, no assertion moves; rides with the determinism fix (a higher ceiling over the racy suite would only convert timing failures into cancellations).
    timeout-minutes: 110
    # Reads the release record for ADR-0004-C13's previous-release half (EKO-1-15 K-06, C-3, C-4).
    permissions:
      contents: read
      packages: read
    steps:
      # Full history: the previous release counts only when its commit is reachable from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Registry login, read only (pulls the previous release's backend)
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Runtime tests (K-01, K-02, K-03, K-04)
        working-directory: backend
        env:
          RELEASE_RECORD_TOKEN: ${{ github.token }}
        run: uv run pytest -m "runtime or previous_release" tests/runtime -v

  # EKO-1-19 (#95): release mode wherever the runtime tests run. The four project images are built
  # once in this run as release.yml's images job builds them (ADR-0004-C31), with Docker only
  # (ADR-0001-C4), and reach the next job as this run's own artifact; nothing is pushed.
  checked-images:
    name: checked image builds (release mode)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend-id: ${{ steps.ids.outputs.backend }}
      frontend-id: ${{ steps.ids.outputs.frontend }}
      proxy-id: ${{ steps.ids.outputs.proxy }}
      backup-id: ${{ steps.ids.outputs.backup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t eko-crm/backend:checked backend
          docker build -t eko-crm/frontend:checked frontend
          docker build -t eko-crm/proxy:checked proxy
          docker build -t eko-crm/backup:checked backup
      - name: Record image IDs
        id: ids
        shell: bash
        run: |
          for name in backend frontend proxy backup; do
            echo "$name=$(docker image inspect --format '{{.Id}}' "eko-crm/$name:checked")" >> "$GITHUB_OUTPUT"
          done
      - name: Save the checked images
        run: docker save -o "$RUNNER_TEMP/checked-images.tar" eko-crm/backend:checked eko-crm/frontend:checked eko-crm/proxy:checked eko-crm/backup:checked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-images
          path: ${{ runner.temp }}/checked-images.tar
          retention-days: 1
          if-no-files-found: error

  # The build-mode runtime job's session on the loaded images, EKO_CHECKED_IMAGES its one
  # difference (K-01). Identity is checked before and after the tests, and afterwards no image a
  # Compose build leaves behind may exist (K-04). The download reads this run's artifact only.
  runtime-checked:
    name: runtime tests on the checked images (release mode)
    needs: [changes, checked-images]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # EKO-1-20 (#76): lock-wait tests, 57 min observed under 60. EKO-1-12 boot-identity (#126, 2026-11-10): 78-83 min measured before cancellation at the 75 ceiling on both runtime jobs (suite ~45-50 + expiry 16:43 + r21 ~10 + restore ~6); 110 = ~30% margin; same measurement, no assertion moves.
    timeout-minutes: 110
    # Reads the release record for ADR-0004-C13's previous-release half, as the runtime job does.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-images
          path: ${{ runner.temp }}
      - name: Load the checked images and check their identity
        shell: bash
        env:
          BACKEND_ID: ${{ needs.checked-images.outputs.backend-id }}
          FRONTEND_ID: ${{ needs.checked-images.outputs.frontend-id }}
          PROXY_ID: ${{ needs.checked-images.outputs.proxy-id }}
          BACKUP_ID: ${{ needs.checked-images.outputs.backup-id }}
        run: |
          docker load -i "$RUNNER_TEMP/checked-images.tar"
          bash scripts/release-images.sh check-identity
      - name: Registry login, read only (pulls the previous release's backend)
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Images before the tests (K-04)
        working-directory: backend
        run: uv run python -m tests.support.session_images snapshot --out "$RUNNER_TEMP/images-before.txt"
      - name: Runtime tests on the checked images (K-01, K-02, K-03, K-04)
        working-directory: backend
        env:
          EKO_CHECKED_IMAGES: "backend=eko-crm/backend:checked frontend=eko-crm/frontend:checked proxy=eko-crm/proxy:checked backup=eko-crm/backup:checked"
          RELEASE_RECORD_TOKEN: ${{ github.token }}
        run: uv run pytest -m "runtime or previous_release" tests/runtime -v
      - name: The checked images are still the ones built (K-04)
        shell: bash
        env:
          BACKEND_ID: ${{ needs.checked-images.outputs.backend-id }}
          FRONTEND_ID: ${{ needs.checked-images.outputs.frontend-id }}
          PROXY_ID: ${{ needs.checked-images.outputs.proxy-id }}
          BACKUP_ID: ${{ needs.checked-images.outputs.backup-id }}
        run: bash scripts/release-images.sh check-identity
      - name: No image built by the tests (K-04)
        working-directory: backend
        run: uv run python -m tests.support.session_images check --before "$RUNNER_TEMP/images-before.txt"
