# EKO-1-34 (#192), TRANSIENT: deleted before the PR is merged (K-07: no file under
# .github/workflows/ differs from the base at the PR head). Gate-1 decisions Q-1 A and Q-4 A,
# written under boundary exception EKO-1-34/boundary-1.
#
# It runs only the two K-06 tests, isolated, ITERATIONS times on ubuntu-latest, with the runtime
# job's own preparation (checkout, uv, `uv sync --locked`; Chromium comes from the session fixture),
# while host network events (`ip -ts monitor all`) and Docker events are recorded. The harness is
# unchanged: the timing marks come from a logging-only plugin loaded with `-p` and from Playwright's
# own `DEBUG=pw:api` log. Each iteration is its own pytest invocation; a failed iteration does not
# stop the loop, and the final step fails the run when any iteration failed or did not run.
# Read-only token, no secret, no registry login; only redacted files are uploaded (ADR-0005).
name: eko134-probe

on:
  push:
    branches: [EKO-1-34-network-changed-flake]
    # Evidence and register commits on the branch start no new two-hour run.
    paths:
      - .github/workflows/eko134-probe.yml
      - backend/tests/**

permissions:
  contents: read

concurrency:
  group: eko134-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: EKO-1-34 probe (K-06 tests looped, host events recorded)
    runs-on: ubuntu-latest
    # About 4 minutes per iteration (two tests of 71-102 s each, a fresh composition and the
    # Chromium fixture per invocation), the first one longer for the image builds: about 80 to
    # 100 minutes for 20. The loop starts no iteration after LOOP_BUDGET_MINUTES, so the
    # redaction and upload steps always get their turn inside this bound.
    timeout-minutes: 240
    env:
      ITERATIONS: "20"
      LOOP_BUDGET_MINUTES: "200"
    steps:
      # The runner context is not available in a job's env: the probe directory is set here.
      - name: Name the probe directory
        shell: bash
        run: echo "PROBE_DIR=$RUNNER_TEMP/eko134" >> "$GITHUB_ENV"
      # The pins and preparation of ci.yml's "runtime tests on the composition" job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: uv sync --locked

      - name: Record the run's identity (runner image, commit, Docker)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PROBE_DIR/raw" "$PROBE_DIR/upload"
          {
            echo "recorded_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "github_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "kernel=$(uname -r)"
            echo "docker_server=$(docker version --format '{{.Server.Version}}')"
            echo "compose=$(docker compose version --short)"
            echo "iterations=$ITERATIONS"
          } > "$PROBE_DIR/upload/run-identity.txt"
          cat "$PROBE_DIR/upload/run-identity.txt"
          ip -br link > "$PROBE_DIR/upload/interfaces-before.txt"
          ip -br addr >> "$PROBE_DIR/upload/interfaces-before.txt"
          docker network ls --format '{{.ID}} {{.Name}} {{.Driver}}' >> "$PROBE_DIR/upload/interfaces-before.txt"

      - name: Start host instrumentation (interfaces, addresses, Docker events)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Selected fields only: no container attribute dump, no environment.
          format='{{.TimeNano}}|{{.Type}}|{{.Actor.ID}}|{{index .Actor.Attributes "name"}}|{{index .Actor.Attributes "container"}}|{{index .Actor.Attributes "type"}}|{{index .Actor.Attributes "com.docker.compose.service"}}|{{index .Actor.Attributes "com.docker.compose.project"}}|{{.Action}}'
          TZ=UTC nohup ip -ts monitor all > "$PROBE_DIR/raw/ip-monitor.log" 2>&1 &
          echo "$!" > "$PROBE_DIR/ip-monitor.pid"
          nohup docker events --format "$format" > "$PROBE_DIR/raw/docker-events.log" 2>&1 &
          echo "$!" > "$PROBE_DIR/docker-events.pid"
          sleep 2
          for name in ip-monitor docker-events; do
            if ! kill -0 "$(cat "$PROBE_DIR/$name.pid")"; then
              echo "::error::$name did not start"
              exit 1
            fi
          done

      - name: Loop the two K-06 tests, one pytest invocation per iteration
        id: loop
        working-directory: backend
        shell: bash
        env:
          # Playwright's own API log, ISO-timestamped on a non-terminal stderr: per-navigation
          # marks without changing the harness. Captured per test, shown for passes too by -rA.
          DEBUG: pw:api
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          tests=(
            "tests/runtime/test_k06_frontend_replacement.py::test_k06_open_spa_recovers_unloaded_lazy_chunk_after_frontend_replacement"
            "tests/runtime/test_k06_frontend_replacement.py::test_r01_two_consecutive_lazy_chunk_failures_stop_after_one_recovery"
          )
          deadline=$(( $(date +%s) + LOOP_BUDGET_MINUTES * 60 ))
          failures=0
          completed=0
          # pytest creates --basetemp itself, but not its parent.
          mkdir -p "$PROBE_DIR/basetemp"
          printf 'iteration\tstart_utc\tend_utc\texit\n' > "$PROBE_DIR/raw/iterations.tsv"
          for i in $(seq -w 1 "$ITERATIONS"); do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::loop budget spent before iteration $i"
              break
            fi
            dir="$PROBE_DIR/raw/iteration-$i"
            mkdir -p "$dir"
            start="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
            if EKO134_TIMING_FILE="$dir/marks.log" uv run pytest -m "runtime or previous_release" \
                -v -rA -p tests.support.eko134_probe_timing \
                --basetemp="$PROBE_DIR/basetemp/iteration-$i" \
                --junitxml="$dir/junit.xml" "${tests[@]}" > "$dir/pytest.log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            end="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
            printf '%s\t%s\t%s\t%s\n' "$i" "$start" "$end" "$rc" >> "$PROBE_DIR/raw/iterations.tsv"
            completed=$((completed + 1))
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::iteration $i exited $rc"
            fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "completed=$completed" >> "$GITHUB_OUTPUT"
          echo "iterations completed: $completed, failed: $failures"

      - name: Stop host instrumentation
        id: stop
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          state=ok
          for name in ip-monitor docker-events; do
            pid_file="$PROBE_DIR/$name.pid"
            if [ ! -f "$pid_file" ]; then
              state=missing
              echo "::error::$name was never started"
            elif kill -0 "$(cat "$pid_file")" 2> /dev/null; then
              kill "$(cat "$pid_file")"
            else
              state=stopped-early
              echo "::error::$name had stopped before the tests ended"
            fi
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          mkdir -p "$PROBE_DIR/upload"
          ip -br link > "$PROBE_DIR/upload/interfaces-after.txt"
          ip -br addr >> "$PROBE_DIR/upload/interfaces-after.txt"
          docker network ls --format '{{.ID}} {{.Name}} {{.Driver}}' >> "$PROBE_DIR/upload/interfaces-after.txt"

      # Nothing under raw/ is uploaded; only this step's output and the identity and interface
      # snapshots above (no secret in either) go up. It redacts every secret-named value of the
      # iterations' synthetic env files, authorization code/state and token parameters, cookies,
      # synthetic passwords and tokens, and withholds env-file NAME=value and docker-inspect lines;
      # then it merges the four clocks (marks, Playwright, ip monitor, Docker) into one timeline
      # per iteration and lists the host events inside each login's first-redirect window.
      - name: Redact and build the per-iteration timelines
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PROBE_DIR/scripts"
          cat > "$PROBE_DIR/scripts/timeline.py" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from datetime import UTC, datetime
          from pathlib import Path

          raw, out, basetemp = (Path(a) for a in sys.argv[1:4])
          out.mkdir(parents=True, exist_ok=True)
          SECRET_NAME = re.compile(r"(PASSWORD|SECRET|KEY|CREDENTIAL|TOKEN)")
          values: set[str] = set()
          env_names: set[str] = set()
          for env in basetemp.rglob("*.env"):
              for line in env.read_text(encoding="utf-8", errors="replace").splitlines():
                  name, sep, value = line.partition("=")
                  if not sep:
                      continue
                  env_names.add(name)
                  if SECRET_NAME.search(name) and len(value) >= 6:
                      values.add(value)
          RULES = [
              (re.compile(r"(?i)\b(code|state|session_state|nonce|code_challenge|code_verifier"
                          r"|id_token_hint|id_token|access_token|refresh_token|token)=[^&\s\"'#<>]*"),
               r"\1=<redacted>"),
              (re.compile(r"(?i)\b(__Host-[\w-]+|__Secure-[\w-]+|KEYCLOAK_[\w-]+"
                          r"|AUTH_SESSION_ID[\w-]*|KC_RESTART|KC_AUTH_SESSION_HASH)=[^;\s\"']*"),
               r"\1=<redacted>"),
              (re.compile(r"synthetic-[A-Za-z0-9_-]+"), "synthetic-<redacted>"),
              (re.compile(r"eyJ[\w-]+\.[\w-]+\.[\w-]*"), "<jwt-redacted>"),
              (re.compile(r"(?i)\b(bearer|basic)\s+[A-Za-z0-9._~+/=-]+"), r"\1 <redacted>"),
              # Playwright's pw:api log names what it types and the value attribute of the
              # element it resolved (the OTP secret field among them).
              (re.compile(r'\b(fill|type|pressSequentially)\("(?:[^"\\]|\\.)*"\)'),
               r"\1(<redacted>)"),
              (re.compile(r'\bvalue=(\\?)"[^"\\]*\1"'), r'value="<redacted>"'),
          ]
          DROP = re.compile(r"(?i)^\s*(set-)?cookie\s*:|^\s*authorization\s*:|\"Env\"\s*:"
                            r"|\"NetworkSettings\"|^\s*[A-Z][A-Z0-9_]*=")
          ENV_LINE = re.compile(
              r"\b(" + "|".join(re.escape(n) for n in sorted(env_names)) + r")=") if env_names else None
          WITHHELD = "<line withheld by the probe's redaction>"

          def clean_line(line: str) -> str:
              if DROP.search(line) or (ENV_LINE is not None and ENV_LINE.search(line)):
                  return WITHHELD
              for value in values:
                  line = line.replace(value, "<redacted>")
              for pattern, replacement in RULES:
                  line = pattern.sub(replacement, line)
              return line

          def read(path: Path) -> list[str]:
              if not path.is_file():
                  return []
              return path.read_text(encoding="utf-8", errors="replace").splitlines()

          def iso(moment: datetime) -> str:
              return moment.isoformat(timespec="microseconds").replace("+00:00", "Z")

          def parse_iso(text: str) -> datetime:
              text = text.rstrip("Z")
              head, _, fraction = text.partition(".")
              stamp = datetime.fromisoformat(head + "." + (fraction + "000000")[:6])
              return stamp.replace(tzinfo=UTC)

          # Host events: ip monitor (continuation lines join their stamped line) and Docker.
          host: list[tuple[datetime, str, str]] = []
          IP_STAMP = re.compile(r"^\[(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?)\]\s?(.*)$")
          for line in read(raw / "ip-monitor.log"):
              found = IP_STAMP.match(line)
              if found:
                  host.append((parse_iso(found.group(1)), "ip", clean_line(found.group(2))))
              elif host and host[-1][1] == "ip":
                  moment, kind, text = host[-1]
                  host[-1] = (moment, kind, text + " | " + clean_line(line.strip()))
          names: dict[str, str] = {}
          docker_rows = []
          for line in read(raw / "docker-events.log"):
              parts = line.split("|", 8)
              if len(parts) != 9 or not parts[0].isdigit():
                  continue
              nano, kind, actor, name, container, net_type, service, project, action = parts
              if kind == "container" and name:
                  names[actor] = name
              docker_rows.append((nano, kind, actor, name, container, net_type, service, project, action))
          for nano, kind, actor, name, container, net_type, service, project, action in docker_rows:
              if action.startswith("exec_"):
                  # The command after the program name stays out of the record.
                  verb, _, command = action.partition(":")
                  action = verb + (": " + command.split()[0] if command.split() else "")
              moment = datetime.fromtimestamp(int(nano) // 1000 / 1_000_000, UTC)
              target = names.get(container, container[:12]) if container else ""
              text = (f"{kind} {action} name={name or actor[:12]} service={service or '-'}"
                      f" project={project or '-'}"
                      + (f" network_type={net_type}" if kind == "network" else "")
                      + (f" container={target}" if target else ""))
              host.append((moment, "docker", clean_line(text)))
          host.sort(key=lambda row: row[0])
          # A parser that silently dropped every line would leave empty windows that look clean:
          # the raw ip log (no secret in it, still passed through the redaction) goes up too, and
          # the counts below say how much of each source was read.
          ip_raw = read(raw / "ip-monitor.log")
          (out / "ip-monitor.log").write_text(
              "".join(clean_line(line) + "\n" for line in ip_raw), encoding="utf-8")
          docker_raw = read(raw / "docker-events.log")
          (out / "parse-report.txt").write_text(
              f"ip_monitor_lines={len(ip_raw)}\n"
              f"ip_events_parsed={sum(1 for row in host if row[1] == 'ip')}\n"
              f"docker_event_lines={len(docker_raw)}\n"
              f"docker_events_parsed={len(docker_rows)}\n", encoding="utf-8")
          (out / "host-events.txt").write_text(
              "".join(f"{iso(m)} {k:6} {t}\n" for m, k, t in host), encoding="utf-8")

          MARK = re.compile(r"^(\S+Z) mark (.*)$")
          PW = re.compile(r"(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d+Z) pw:api (.*)$")
          summary = ["iteration\tstart_utc\tend_utc\texit\ttest\toutcome\terror\t"
                     "redirect_window_start\tredirect_window_end\twindow_end_by\t"
                     "ip_events_in_window\tdocker_events_in_window"]
          windows_all = []
          rows = [r.split("\t") for r in read(raw / "iterations.tsv")[1:] if r]
          for number, start, end, code in rows:
              source = raw / f"iteration-{number}"
              target = out / f"iteration-{number}"
              target.mkdir(parents=True, exist_ok=True)
              # A captured stream can arrive with its line breaks escaped as a literal "\n".
              log = [clean_line(part) for line in read(source / "pytest.log")
                     for part in line.split("\\n")]
              (target / "pytest.log").write_text("\n".join(log) + "\n", encoding="utf-8")
              outcomes: dict[str, tuple[str, str]] = {}
              junit = source / "junit.xml"
              if junit.is_file():
                  for case in ET.parse(junit).getroot().iter("testcase"):
                      bad = case.find("failure")
                      if bad is None:
                          bad = case.find("error")
                      if bad is not None:
                          message = (bad.get("message") or "").splitlines()
                          outcomes[case.get("name", "")] = (bad.tag, clean_line(message[0] if message else ""))
                      elif case.find("skipped") is not None:
                          outcomes[case.get("name", "")] = ("skipped", "")
                      else:
                          outcomes[case.get("name", "")] = ("passed", "")
              events: list[tuple[datetime, str, str]] = []
              for line in read(source / "marks.log"):
                  found = MARK.match(line)
                  if found:
                      events.append((parse_iso(found.group(1)), "mark", found.group(2)))
              for line in log:
                  found = PW.search(line)
                  if found:
                      events.append((parse_iso(found.group(1)), "pw:api", found.group(2)))
              low, high = parse_iso(start), parse_iso(end)
              merged = events + [row for row in host if low <= row[0] <= high]
              merged.sort(key=lambda row: row[0])
              (target / "timeline.txt").write_text(
                  "".join(f"{iso(m)} {k:6} {t}\n" for m, k, t in merged), encoding="utf-8")
              events.sort(key=lambda row: row[0])
              lines_out = []
              for test in sorted(outcomes) or ["(no junit)"]:
                  outcome, error = outcomes.get(test, ("unknown", ""))
                  call = [m for m, k, t in events if k == "mark" and t == f"phase call start {test}"]
                  call_end = [m for m, k, t in events if k == "mark" and t == f"phase call end {test}"]
                  w_start = w_end = None
                  end_by = "none"
                  if call:
                      c0 = call[0]
                      c1 = call_end[0] if call_end else high
                      login = [m for m, k, t in events
                               if k == "mark" and t == "browser_login start" and c0 <= m <= c1]
                      if login:
                          l0 = login[0]
                          login_end = [(m, t) for m, k, t in events if k == "mark"
                                       and t in ("browser_login returned", "browser_login raised")
                                       and m >= l0]
                          loaded = [m for m, k, t in events if k == "pw:api"
                                    and t.strip() == '"load" event fired' and m >= l0]
                          w_start = loaded[0] if loaded else l0
                          to_auth = [m for m, k, t in events if k == "pw:api"
                                     and t.strip().startswith('navigated to "https://auth.')
                                     and m >= w_start]
                          stop = login_end[0] if login_end else (c1, "call end")
                          if to_auth and to_auth[0] <= stop[0]:
                              w_end, end_by = to_auth[0], "navigated-to-auth-host"
                          else:
                              w_end, end_by = stop[0], stop[1].replace(" ", "-")
                  inside = [row for row in host if w_start and w_end and w_start <= row[0] <= w_end]
                  ip_count = sum(1 for row in inside if row[1] == "ip")
                  dk_count = sum(1 for row in inside if row[1] == "docker")
                  summary.append("\t".join([number, start, end, code, test, outcome, error,
                                            iso(w_start) if w_start else "", iso(w_end) if w_end else "",
                                            end_by, str(ip_count), str(dk_count)]))
                  lines_out.append(f"## iteration {number} - {test} - {outcome}")
                  lines_out.append(f"error: {error or '-'}")
                  lines_out.append(f"first-redirect window: {iso(w_start) if w_start else '?'}"
                                   f" .. {iso(w_end) if w_end else '?'} (ends by {end_by})")
                  lines_out.append(f"host events inside: ip={ip_count} docker={dk_count}")
                  lines_out += [f"  {iso(m)} {k:6} {t}" for m, k, t in inside]
                  if w_start:
                      before = [row for row in host
                                if (w_start - row[0]).total_seconds() <= 30 and row[0] < w_start]
                      lines_out.append("host events in the 30 s before the window:")
                      lines_out += [f"  {iso(m)} {k:6} {t}" for m, k, t in before]
                  lines_out.append("")
              (target / "windows.txt").write_text("\n".join(lines_out) + "\n", encoding="utf-8")
              windows_all += lines_out
          (out / "iterations.tsv").write_text("\n".join(summary) + "\n", encoding="utf-8")
          (out / "windows.txt").write_text("\n".join(windows_all) + "\n", encoding="utf-8")
          print("\n".join(summary))
          PY
          python3 -I "$PROBE_DIR/scripts/timeline.py" "$PROBE_DIR/raw" "$PROBE_DIR/upload" "$PROBE_DIR/basetemp"
          # The iterations' env files hold the synthetic secrets; nothing of basetemp is uploaded.
          rm -rf "$PROBE_DIR/basetemp"
          {
            echo '### EKO-1-34 probe iterations'
            echo '```'
            cut -f1,4,5,6,10,11,12 "$PROBE_DIR/upload/iterations.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eko134-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eko134/upload
          retention-days: 30
          if-no-files-found: error

      # No masking: red when any iteration failed, when fewer than ITERATIONS ran, or when the
      # instrumentation did not cover the whole loop.
      - name: Verdict
        if: always()
        shell: bash
        env:
          FAILURES: ${{ steps.loop.outputs.failures }}
          COMPLETED: ${{ steps.loop.outputs.completed }}
          INSTRUMENTATION: ${{ steps.stop.outputs.state }}
        run: |
          set -Eeuo pipefail
          echo "iterations: ${COMPLETED:-none} of $ITERATIONS, failed: ${FAILURES:-unknown}, instrumentation: ${INSTRUMENTATION:-unknown}"
          [ "${COMPLETED:-}" = "$ITERATIONS" ] || { echo "::error::not every iteration ran"; exit 1; }
          [ "${INSTRUMENTATION:-}" = ok ] || { echo "::error::instrumentation incomplete"; exit 1; }
          [ "${FAILURES:-}" = 0 ] || { echo "::error::$FAILURES of $ITERATIONS iterations failed"; exit 1; }
