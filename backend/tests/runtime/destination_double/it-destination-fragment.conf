# Destination host: sshd_config fragment for the backup account of one environment
# (ADR-0004 addendum 2026-10-30). Handed to the IT department at EKO-1-08 (#36); the double in
# this directory runs the same sftp-server flags behind a recorder, not this fragment as written.
#
# /srv/eko-backup is owned by root, mode 0755, and holds one directory, incoming, owned by the
# account, mode 0300 (write and search only: the account can neither read nor list it).
# internal-sftp logs at VERBOSE; the IT department keeps that log and the SSH authentication
# record off the server.
Match User eko-backup
  AuthenticationMethods publickey
  PasswordAuthentication no
  KbdInteractiveAuthentication no
  ChrootDirectory /srv/eko-backup
  ForceCommand internal-sftp -l VERBOSE -u 0377 -p open,write,close,stat,lstat,fstat,realpath
  DisableForwarding yes
  PermitTunnel no
  PermitTTY no
  PermitUserRC no
