# K-07 contrasts holding values the repository scans must flag. Excluded from those scans by its
# exact name (repo_checks.CHECK_FIXTURES). Every value is invented; none belongs to anyone.
secret_assignments:
  - {path: .env.example, text: "APP_DB_PASSWORD=change-me\n"}
  - {path: deploy/x.sh, text: "export POSTGRES_PASSWORD=synthetic\n"}
  - {path: x/compose.yaml, text: "      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-devpass}\n"}
  - {path: x/settings.json, text: "{\"KC_DB_PASSWORD\": \"abc\"}\n"}
  - {path: .github/workflows/x.yml, text: "    env:\n      APP_DB_PASSWORD: ${{ secrets.APP }}\n"}
personal_data:
  - "contact: jan.kowalski@gmail.com"
  - "NIP 526-104-08-28"
  - "nip = 5261040828"
  - "tel. +48 601 234 567"
  - "phone: 601-234-567"
allowed_references:
  - {path: x.yml, text: "      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}\n"}
# Decision H6-D A (Issue #195, 2026-11-18): an exact value a locked acceptance criterion names,
# allowed in one file only; `personal_data` removes it from a line of that file before checking.
criterion_values:
  - path: backend/tests/runtime/eko301/test_eko301_k03_phone_and_email.py
    value: "601 234 567"
    criterion: "EKO-3-01 K-03"
# The allowance's contrasts: the allowed value passes; another value, or the allowed value next to
# another phone-shaped value, or the allowed value in another file, is still found.
criterion_value_contrasts:
  allowed: 'phone("601 234 567")'
  other_value: 'phone("601 234 568")'
  other_on_the_line: 'phone("601 234 567"), phone("602 345 678")'
