[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The database URL is built from app.core.settings in migrations/env.py, never written here.
# No logging sections: migrations/env.py installs the processes' one line form
# (app.core.logs, ADR-0005 addendum 2026-11-02, docs/operations/log-format.md).
