      <script type="module" async="" blocking="render">
          const DARK_MODE_CLASS = "pf-v5-theme-dark";
          const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

          updateDarkMode(mediaQuery.matches);
          mediaQuery.addEventListener("change", (event) => updateDarkMode(event.matches));

          function updateDarkMode(isEnabled) {
            const { classList } = document.documentElement;

            if (isEnabled) {
              classList.add(DARK_MODE_CLASS);
            } else {
              classList.remove(DARK_MODE_CLASS);
            }
          }
      </script>

    <script type="module">
        document.addEventListener("click", (event) => {
            const link = event.target.closest("a[data-once-link]");

            if (!link) {
                return;
            }

            if (link.getAttribute("aria-disabled") === "true") {
                event.preventDefault();
                return;
            }

            const { disabledClass } = link.dataset;

            if (disabledClass) {
                link.classList.add(...disabledClass.trim().split(/\s+/));
            }

            link.setAttribute("role", "link");
            link.setAttribute("aria-disabled", "true");
        });
    </script>

    <script type="module">
        import { validatePassword } from "/resources/epi20/login/eko-crm/js/password-policy.js";

        const activePolicies = [
            { name: "length", policy: { value: 12, error: "Nieprawidłowe hasło: minimalna długość {0}." } },
            { name: "maxLength", policy: { value: -1, error: "Nieprawidłowe hasło: maksymalna długość {0}." } },
            { name: "lowerCase", policy: { value: -1, error: "Nieprawidłowe hasło: musi zawierać co najmniej {0} małych liter." } },
            { name: "upperCase", policy: { value: -1, error: "Nieprawidłowe hasło: musi zawierać co najmniej {0} wielkich liter." } },
            { name: "digits", policy: { value: -1, error: "Nieprawidłowe hasło: musi zawierać przynajmniej {0} cyfr." } },
            { name: "specialChars", policy: { value: -1, error: "Nieprawidłowe hasło: musi zawierać przynajmniej {0} znaków specjalnych." } }
        ].filter(p => p.policy.value !== -1);

        document.getElementById("password-new").addEventListener("change", (event) => {

            const errorContainer = document.getElementById("input-error-container-password-new");
            const template = document.querySelector("#errorTemplate").content.cloneNode(true);
            const errors = validatePassword(event.target.value, activePolicies);

            if (errors.length === 0) {
                errorContainer.replaceChildren();
                return;
            }

            const errorList = template.querySelector("ul");
            const htmlErrors = errors.forEach((e) => {
                const row = document.querySelector("#errorItemTemplate").content.cloneNode(true);
                const li = row.querySelector("li");
                li.textContent = e;
                errorList.appendChild(li);
            });
            errorContainer.replaceChildren(template);
        });
    </script>
